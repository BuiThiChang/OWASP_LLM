version: "3.8"

services:
  # 1. Cơ sở dữ liệu PostgreSQL lưu trữ Logs & Threat Intel
  db:
    image: postgres:16-alpine
    container_name: llmvault_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-llmvault_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # 2. Ứng dụng tích hợp (Proxy Guardrail + Streamlit Dashboard)
  app:
    build: .
    container_name: llmvault_app
    restart: always
    ports:
      - "${STREAMLIT_PORT:-8501}:8501"
      - "${PROXY_PORT:-11435}:11435"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      # Trỏ tới Ollama đang chạy trên máy Host bên ngoài
      OLLAMA_CORE_URL: http://host.docker.internal:${OLLAMA_PORT:-11436}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - db

volumes:
  pgdata:
