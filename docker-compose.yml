services:
  db:
    image: postgres:16-alpine
    container_name: llmvault_postgres
    restart: always
    environment:
      POSTGRES_DB: llmvault_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    image: chang1997/llm-security-tester:latest
    container_name: llmvault_app
    restart: always
    ports:
      - "8501:8501"
      - "11435:11435"
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: llmvault_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      OLLAMA_CORE_URL: http://host.docker.internal:11436
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - db

volumes:
  pgdata:
